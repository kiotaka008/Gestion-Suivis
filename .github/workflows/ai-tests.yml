name: AI Service Tests

on:
  push:
    branches: [main, develop, feature/**]
    paths:
      - 'ai/**'
      - '.github/workflows/ai-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'ai/**'

jobs:
  test:
    name: Run AI Service tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ai

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pytest-cov pytest-mock
          echo "--- Packages pytest installes ---"
          pip list | grep -i pytest || true

      - name: Run tests with coverage
        env:
          INTERNAL_API_KEY: test-internal-key-1234567890
          GEMINI_API_KEY: test-gemini-key-1234567890
          GEMINI_MODEL: gemini-3.8-flash
          ENVIRONMENT: development
          DEBUG: "true"
          LOG_LEVEL: WARNING
        run: |
          pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ai/coverage.xml
          retention-days: 7