spring.application.name=backend

# Base PostgreSQL 18 (schéma géré par l'équipe base de données).
# Les valeurs réelles sont fournies par variables d'environnement.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestion_suivis}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Le schéma n'est jamais créé ni modifié par l'application : Hibernate vérifie
# seulement que les entités correspondent aux tables existantes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
