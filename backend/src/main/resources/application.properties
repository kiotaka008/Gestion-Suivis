spring.application.name=backend

# Port de l'API : le proxy Vite du frontend (vite.config.ts) redirige /api vers ce port.
server.port=${SERVER_PORT:3000}

# Base PostgreSQL 15+ : schéma officiel « ProjectManager SaaS » (dossier
# ProjectManager_SaaS_Database du dépôt, branche develop). Base par défaut : projectmanager.
# Les valeurs réelles sont fournies par variables d'environnement.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/projectmanager}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Le schéma n'est jamais créé ni modifié par l'application : Hibernate vérifie
# seulement que les entités correspondent aux tables existantes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Adresse IP des clients (limitation des tentatives de connexion, LimiteurConnexion).
# none (défaut) : l'adresse est celle de la connexion TCP, l'en-tête X-Forwarded-For est ignoré
# (il peut être falsifié par n'importe quel client).
# native : à n'utiliser que derrière un proxy inverse (nginx, Apache...) ; Tomcat ne croit alors
# X-Forwarded-For que s'il vient d'un proxy de confiance (server.tomcat.remoteip.internal-proxies,
# par défaut les réseaux privés et localhost : à restreindre à l'adresse réelle du proxy).
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
